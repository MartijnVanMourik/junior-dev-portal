name: Generate Arcade JSON

on:
  push:
    branches:
      - main
    paths:
      - 'datasources/**/links.txt'
      - 'scripts/generate_arcade_json.py'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run JSON Generator Script
        run: python3 scripts/generate_arcade_json.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datasources/**/*.json
          git commit -m "Auto-generate games.json and index.json" || echo "No changes to commit"
          git push
