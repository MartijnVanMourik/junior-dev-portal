<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>Arcade Klas Launcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            margin: 0;
            position: relative;
            /* Voor pseudo-element */
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('assets/maze.png') no-repeat center center;
            background-size: 100% 100%;
            /* Stretcht precies mee met het scherm */
            opacity: 0.1;
            /* Iets beter te zien voor je test, pas aan naar wens */
            z-index: 1;
            /* Zorg dat je niet per ongeluk op de achtergrond klikt */
            pointer-events: none;
            image-rendering: pixelated;
            /* Arcade feel! */
        }

        .arcade-marquee {
            background: linear-gradient(to bottom, #111, #000);
            border-bottom: 4px solid #333;
            padding: 20px 0;
            text-align: center;
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 1);
        }

        .arcade-marquee h1 {
            margin: 0;
            color: #00ff00;
            font-size: 28px;
            text-shadow: 0 0 10px #00ff00, 4px 4px 0px #005500;
            letter-spacing: 2px;
        }

        .sprite {
            height: 60px;
            /* Sprites iets groter */
            image-rendering: pixelated;
            /* Voor de retro look bij het uitschalen */
        }

        .instructions-joystick {
            position: relative;
            z-index: 10;
            text-align: center;
            font-size: 10px;
            color: #777;
            letter-spacing: 1px;
            margin-bottom: 25px;
            /* Beetje ruimte tussen de twee teksten */
        }

        .instructions-kies {
            position: relative;
            z-index: 10;
            text-align: center;
            color: #00ffff;
            font-size: 18px;
            text-shadow: 0 0 5px #00ffff, 2px 2px #008888;
        }

        #carousel {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 65vh;
            margin: 25px 0;
            padding: 0 calc(50vw - 241px);
            /* Precies in the midden uitlijnen */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .game-card {
            min-width: 340px;
            width: 340px;
            height: 380px;
            /* Vaste hoogte voorkomt springen van elementen */
            padding: 25px;
            border: 6px solid #333;
            background: #111;
            margin: 0 40px;
            transition: all 0.3s;
            opacity: 0.2;
            transform: scale(0.7);
            text-align: center;
        }

        .game-card.selected {
            border-color: #00ff00;
            transform: scale(1.1);
            opacity: 1;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.6);
        }

        .thumb {
            width: 340px;
            height: 255px;
            /* Altijd de MakeCode verhouding aanhouden */
            object-fit: cover;
            border: 4px solid #222;
            margin-bottom: 25px;
            image-rendering: pixelated;
        }

        .title {
            font-size: 16px;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.4;
        }

        .author {
            font-size: 10px;
            color: #00ffff;
        }



        #game-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
        }

        #game-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #exit-btn {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            /* Zorg dat de knop altijd bóven de game (z-index 1000) ligt */
            padding: 10px 15px;
            background: #ff0000;
            color: white;
            border: 4px solid white;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            font-size: 14px;
        }

        #exit-btn:hover {
            background: #ff5555;
        }

        #secret-menu {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            border: 4px solid #00ff00;
            padding: 30px;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 0 30px #00ff00;
        }

        #secret-menu h2 {
            color: #fff;
            margin-top: 0;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .year-btn {
            display: block;
            width: 100%;
            background: #222;
            color: #00ffff;
            border: 2px solid #008888;
            padding: 15px;
            margin-bottom: 10px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        .year-btn:hover,
        .year-btn.selected {
            background: #008888;
            color: #111;
            transform: scale(1.05);
            /* Lichte arcade-pop als hij geselecteerd is */
        }
    </style>
</head>

<body>

    <div class="arcade-marquee">
        <img class="sprite" src="assets/pacman.png" alt="Pac-Man">
        <h1>JUNIOR DEV GAME PORTAL</h1>
        <img class="sprite" src="assets/blinky.png" alt="Ghost">
    </div>
    <div id="carousel"></div>
    <div class="instructions-joystick">JOYSTICK = KIEZEN | START = SPELEN</div>
    <div class="instructions-kies">KIES EEN GAME</div>
    <div id="game-container"></div>
    <div id="exit-btn">X SLUITEN</div>

    <div id="secret-menu">
        <h2>KIES JAARGANG</h2>
        <div id="year-buttons"></div>
    </div>

    <script>
        let games = [];
        let currentIndex = 0;
        let isPlaying = false;

        // Geheime Menu Tracking
        let availableYears = [];
        let currentYear = '';
        let enterPresses = 0;
        let lastEnterTime = 0;

        let isSecretMenuOpen = false;
        let secretMenuIndex = 0;
        let secretMenuOptions = [];

        const container = document.getElementById('carousel');
        const gameContainer = document.getElementById('game-container');
        const exitBtn = document.getElementById('exit-btn');

        function exitGame() {
            if (isPlaying) {
                gameContainer.style.display = 'none';
                gameContainer.innerHTML = ''; // iframe afbreken = geheugen leegmaken
                exitBtn.style.display = 'none';
                isPlaying = false;
            }
        }

        // Simpele klik op de zichtbare knop
        exitBtn.addEventListener('click', exitGame);

        // Constante controle voor USB Gamepads (zoals Arcade joysticks)
        // Hiermee omzeilen we het feit dat iframes normale toetsaanslagen (zoals ESC) opslokken.
        function pollGamepads() {
            if (isPlaying) {
                const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                for (let gp of gamepads) {
                    if (gp && gp.buttons) {
                        // De meeste USB arcade encoders gebruiken specifieke buttons voor SELECT (Coin) en START
                        // Bijvoorbeeld Button 8 = Select, Button 9 = Start.
                        // Je kunt deze nummers aanpassen als jouw arcadekast dat vereist.
                        // Hier triggeren we exit als bijvoorbeeld button 8 of 9 (P1 Start/Insert Coin) wordt ingedrukt, 
                        // OF als er een 'Home' button (vaak button 12 of hoger) aanwezig is.
                        // Een bekende veilige combinatie is vaak de Select Knop (button 8).
                        const btnSelect = gp.buttons[8]?.pressed;
                        const btnStart = gp.buttons[9]?.pressed;

                        // We checken of Select + Start samen ingedrukt worden, OF je kunt 1 knop hard-coden.
                        // Voor het gemak nu: Als knop 8 wordt ingedrukt, exit game.
                        if (btnSelect || (gp.buttons[6]?.pressed /* L2 */) || (gp.buttons[16]?.pressed /* Xbox Guide */)) {
                            exitGame();
                            break;
                        }
                    }
                }
            }
            requestAnimationFrame(pollGamepads); // Blijf 60x per seconde kijken of de knop is ingedrukt
        }
        pollGamepads();

        async function init() {
            try {
                const indexRes = await fetch('datasources/index.json?t=' + Date.now());
                const indexData = await indexRes.json();

                availableYears = indexData.years;
                currentYear = indexData.latest;

                buildSecretMenu();
                if (currentYear) {
                    loadYear(currentYear);
                } else {
                    container.innerHTML = "<h2>GEEN JAARGANGEN GEVONDEN</h2>";
                }
            } catch (e) { document.body.innerHTML = "<h1>FOUT: datasources/index.json niet gevonden</h1>"; }
        }

        function buildSecretMenu() {
            secretMenuOptions = [];
            availableYears.forEach(year => {
                secretMenuOptions.push({ label: `JAARGANG ${year}`, action: () => loadYear(year) });
            });
            secretMenuOptions.push({ label: 'ALLE SPELLEN (OPEN AVOND)', action: () => loadYear('all') });
            secretMenuOptions.push({
                label: 'X SLUITEN', action: () => {
                    document.getElementById('secret-menu').style.display = 'none';
                    isSecretMenuOpen = false;
                }
            });
            renderSecretMenu();
        }

        function renderSecretMenu() {
            const btnContainer = document.getElementById('year-buttons');
            btnContainer.innerHTML = '';

            secretMenuOptions.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `year-btn ${index === secretMenuIndex ? 'selected' : ''}`;
                btn.innerText = opt.label;

                if (opt.label === 'X SLUITEN') {
                    btn.style.borderColor = 'red';
                    // Alleen de tekst rood maken als hij niet geselecteerd is
                    if (index !== secretMenuIndex) btn.style.color = 'red';
                }

                btn.onclick = opt.action;
                btnContainer.appendChild(btn);
            });
        }

        async function loadYear(year) {
            try {
                currentYear = year;
                const response = await fetch(`datasources/${year}/games.json?t=` + Date.now());
                games = await response.json();

                currentIndex = 0; // Reset
                if (games.length > 0) {
                    render();
                } else {
                    container.innerHTML = "<h2>GEEN GAMES IN LIJST</h2>";
                }
                document.getElementById('secret-menu').style.display = 'none';
                isSecretMenuOpen = false;
            } catch (e) { container.innerHTML = `<h1>FOUT: Inladen ${year} mislukt</h1>`; }
        }

        function render() {
            container.innerHTML = '';

            games.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = `game-card ${index === currentIndex ? 'selected' : ''}`;
                card.id = `card-${index}`;
                const thumb = `https://makecode.com/api/${game.shareId}/thumb`;

                card.innerHTML = `
                    <img class="thumb" src="${thumb}" onerror="this.src='assets/backup.jpg'">
                    <div class="title">${game.name.toUpperCase()}</div>
                    <div class="author">${game.author.toUpperCase()}</div>
                `;
                container.appendChild(card);
            });

            // Wiskundig perfecte uitlijning (width + padding + border + margin)
            // 340 + 50 + 12 + 80 = 482px per kaart opschuiven.
            const offset = currentIndex * -482;
            container.style.transform = `translateX(${offset}px)`;
        }

        document.addEventListener('keydown', (e) => {
            if (isPlaying) {
                // Werkt alleen als we buiten het iframe ergens op de pagina hebben geklikt met een muis:
                if (e.key === 'Escape' || e.key === 'q' || e.key === 'Q') {
                    exitGame();
                }
                return;
            }

            // --- Navigatie binnen het geheime menu ---
            if (isSecretMenuOpen) {
                if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    if (secretMenuIndex < secretMenuOptions.length - 1) {
                        secretMenuIndex++;
                        renderSecretMenu();
                    }
                } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    if (secretMenuIndex > 0) {
                        secretMenuIndex--;
                        renderSecretMenu();
                    }
                } else if (e.key === 'Enter' || e.key === ' ') {
                    secretMenuOptions[secretMenuIndex].action();
                }
                return; // Stop verdere verwerking zodat we niet carrousel scrollen
            }

            if (e.key === 'ArrowRight' && currentIndex < games.length - 1) {
                currentIndex++;
                render();
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                currentIndex--;
                render();
            } else if (e.key === ' ') {
                // --- Geheime Menu Check (Spatie / A-knop) ---
                const now = Date.now();
                if (now - lastEnterTime < 2000) {
                    enterPresses++;
                } else {
                    enterPresses = 1; // Eerste druk na lange tijd
                }
                lastEnterTime = now;

                if (enterPresses >= 5) {
                    enterPresses = 0;
                    isSecretMenuOpen = true;
                    secretMenuIndex = 0; // Reset naar de bovenste optie
                    renderSecretMenu();
                    document.getElementById('secret-menu').style.display = 'block';
                }
                // --------------------------
            } else if (e.key === 'Enter') {
                isPlaying = true;

                // We and gebruik maken van ---run met de juiste fullscreen flags
                const game = games[currentIndex];
                const gameUrl = `https://arcade.makecode.com/---run?id=${game.shareId}&fullscreen=1&hideSimButtons=1&nofooter=1`;

                gameContainer.innerHTML = `<iframe src="${gameUrl}" sandbox="allow-scripts allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox allow-forms" allow="gamepad; autoplay" allowfullscreen tabindex="-1"></iframe>`;
                gameContainer.style.display = 'block';
                exitBtn.style.display = 'block';

                setTimeout(() => {
                    const iframe = gameContainer.querySelector('iframe');
                    if (iframe && iframe.contentWindow) {
                        iframe.focus(); // Focus the iframe element
                        iframe.contentWindow.focus(); // Instruct the inner window to take focus
                    }
                }, 100);
            }
        });

        init();
    </script>
</body>

</html>
