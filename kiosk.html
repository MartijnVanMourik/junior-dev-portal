<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>JUNIOR DEV GAME PORTAL</title>
    <link rel="icon" type="image/png" href="assets/pacman.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            cursor: none !important;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            margin: 0;
            position: relative;
        }

        /* De maze-achtergrond uit de screenshots */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('assets/maze.png') no-repeat center center;
            background-size: 100% 100%;
            opacity: 0.1;
            z-index: -1;
            pointer-events: none;
            image-rendering: pixelated;
        }

        .arcade-marquee {
            background: linear-gradient(to bottom, #111, #000);
            border-bottom: 4px solid #333;
            padding: 20px 0;
            text-align: center;
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 1);
        }

        .arcade-marquee h1 {
            margin: 0;
            color: #00ff00;
            font-size: 28px;
            text-shadow: 0 0 10px #00ff00, 4px 4px 0px #005500;
            letter-spacing: 2px;
        }

        .sprite {
            height: 60px;
            image-rendering: pixelated;
        }

        /* --- Nieuw: Het Arcade Laadscherm --- */
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999;
            /* Tussen het carousel en het iframe-container */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        /* Het groene pixel-kader gebaseerd op de screenshots */
        .loading-modal {
            background: #111;
            border: 6px solid #00ff00;
            box-shadow: 0 0 30px #00ff00;
            padding: 40px;
            width: 70%;
            max-width: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 30px;
            border-radius: 4px;
        }

        .loading-title {
            color: #00ff00;
            font-size: 30px;
            text-shadow: 0 0 10px #00ff00, 2px 2px #005500;
            letter-spacing: 4px;
        }

        /* Een geanimeerde pixel-loader */
        .loader-dots {
            display: flex;
            gap: 15px;
        }

        .dot {
            width: 15px;
            height: 15px;
            background-color: #00ff00;
            animation: dot-blink 1.4s infinite;
            image-rendering: pixelated;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dot-blink {

            0%,
            20% {
                opacity: 0;
            }

            40%,
            60% {
                opacity: 1;
            }

            80%,
            100% {
                opacity: 0;
            }
        }

        .loading-message {
            color: #00ffff;
            font-size: 14px;
            letter-spacing: 1px;
            line-height: 1.6;
            margin-top: 10px;
        }

        /* --- Einde Nieuw: Stijlen --- */

        /* Bestaande stijlen blijven gelijk... */
        .instructions-joystick {
            position: relative;
            z-index: 10;
            text-align: center;
            font-size: 10px;
            color: #777;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .instructions-kies {
            position: relative;
            z-index: 10;
            text-align: center;
            color: #00ffff;
            font-size: 18px;
            text-shadow: 0 0 5px #00ffff, 2px 2px #008888;
        }

        #carousel {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 65vh;
            margin: 25px 0;
            padding: 0 calc(50vw - 241px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .game-card {
            min-width: 340px;
            width: 340px;
            height: 380px;
            padding: 25px;
            border: 6px solid #333;
            background: #111;
            margin: 0 40px;
            transition: all 0.3s;
            opacity: 0.2;
            transform: scale(0.7);
            text-align: center;
        }

        .game-card.selected {
            border-color: #00ff00;
            transform: scale(1.1);
            opacity: 1;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.6);
        }

        .thumb {
            width: 340px;
            height: 255px;
            object-fit: cover;
            border: 4px solid #222;
            margin-bottom: 25px;
            image-rendering: pixelated;
        }

        .title {
            font-size: 16px;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.4;
        }

        .author {
            font-size: 10px;
            color: #00ffff;
        }

        #game-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
            /* iframe bóven het laadscherm */
        }

        #game-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #exit-btn {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            padding: 10px 15px;
            background: #ff0000;
            color: white;
            border: 4px solid white;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            font-size: 14px;
        }

        #exit-btn:hover {
            background: #ff5555;
        }

        #secret-menu {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            border: 4px solid #00ff00;
            padding: 30px;
            z-index: 1002;
            /* Altijd bóvenalles */
            text-align: center;
            box-shadow: 0 0 30px #00ff00;
        }

        #secret-menu h2 {
            color: #fff;
            margin-top: 0;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .year-btn {
            display: block;
            width: 100%;
            background: #222;
            color: #00ffff;
            border: 2px solid #008888;
            padding: 15px;
            margin-bottom: 10px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        .year-btn:hover,
        .year-btn.selected {
            background: #008888;
            color: #111;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="arcade-marquee">
        <img class="sprite" src="assets/pacman.png" alt="Pac-Man">
        <h1>JUNIOR DEV GAME PORTAL</h1>
        <img class="sprite" src="assets/blinky.png" alt="Ghost">
    </div>

    <div id="loading-overlay" style="display: none;">
        <div class="loading-modal">
            <div class="loading-title">LOADING GAME...</div>
            <div class="loader-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                }
                <div class="loading-message">INITIALIZING MAKECODE ARCADE ENGINE.<br>PLEASE WAIT.</div>
            </div>
        </div>
        <div id="carousel"></div>
        <div class="instructions-joystick">JOYSTICK = KIEZEN | START = SPELEN</div>
        <div class="instructions-kies">KIES EEN GAME</div>
        <div id="game-container"></div>
        <div id="exit-btn">X SLUITEN</div>

        <div id="secret-menu">
            <h2>KIES JAARGANG</h2>
            <div id="year-buttons"></div>
        </div>

        <script>
            let games = [];
            let currentIndex = 0;
            let isPlaying = false;

            let availableYears = [];
            let currentYear = '';
            let enterPresses = 0;
            let lastEnterTime = 0;

            let isSecretMenuOpen = false;
            let secretMenuIndex = 0;
            let secretMenuOptions = [];

            const container = document.getElementById('carousel');
            const gameContainer = document.getElementById('game-container');
            const exitBtn = document.getElementById('exit-btn');
            const loadingOverlay = document.getElementById('loading-overlay'); // Nieuw

            function exitGame() {
                if (isPlaying) {
                    gameContainer.style.display = 'none';
                    gameContainer.innerHTML = '';
                    exitBtn.style.display = 'none';
                    loadingOverlay.style.display = 'none'; // Verberg laadscherm bij exit
                    isPlaying = false;
                }
            }

            exitBtn.addEventListener('click', exitGame);

            function pollGamepads() {
                if (isPlaying) {
                    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                    for (let gp of gamepads) {
                        if (gp && gp.buttons) {
                            const btnSelect = gp.buttons[8]?.pressed;
                            const btnStart = gp.buttons[9]?.pressed;

                            if (btnSelect || btnStart || (gp.buttons[6]?.pressed) || (gp.buttons[16]?.pressed)) {
                                exitGame();
                                break;
                            }
                        }
                    }
                }
                requestAnimationFrame(pollGamepads);
            }
            pollGamepads();

            const activeKeys = new Set();
            document.addEventListener('keyup', (e) => {
                activeKeys.delete(e.key);
            });

            async function init() {
                try {
                    const indexRes = await fetch('datasources/index.json?t=' + Date.now());
                    const indexData = await indexRes.json();

                    availableYears = indexData.years;
                    currentYear = indexData.latest;

                    buildSecretMenu();
                    if (currentYear) {
                        loadYear(currentYear);
                    } else {
                        container.innerHTML = "<h2>GEEN JAARGANGEN GEVONDEN</h2>";
                    }
                } catch (e) { document.body.innerHTML = "<h1>FOUT: datasources/index.json niet gevonden</h1>"; }
            }

            function buildSecretMenu() {
                secretMenuOptions = [];
                availableYears.forEach(year => {
                    secretMenuOptions.push({ label: `JAARGANG ${year}`, action: () => loadYear(year) });
                });
                secretMenuOptions.push({ label: 'ALLE SPELLEN (OPEN AVOND)', action: () => loadYear('all') });
                secretMenuOptions.push({
                    label: 'X SLUITEN', action: () => {
                        document.getElementById('secret-menu').style.display = 'none';
                        isSecretMenuOpen = false;
                    }
                });
                renderSecretMenu();
            }

            function renderSecretMenu() {
                const btnContainer = document.getElementById('year-buttons');
                btnContainer.innerHTML = '';

                secretMenuOptions.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = `year-btn ${index === secretMenuIndex ? 'selected' : ''}`;
                    btn.innerText = opt.label;

                    if (opt.label === 'X SLUITEN') {
                        btn.style.borderColor = 'red';
                        if (index !== secretMenuIndex) btn.style.color = 'red';
                    }

                    btn.onclick = opt.action;
                    btnContainer.appendChild(btn);
                });
            }

            async function loadYear(year) {
                try {
                    currentYear = year;
                    const response = await fetch(`datasources/${year}/games.json?t=` + Date.now());
                    games = await response.json();

                    currentIndex = 0;
                    if (games.length > 0) {
                        render();
                    } else {
                        container.innerHTML = "<h2>GEEN GAMES IN LIJST</h2>";
                    }
                    document.getElementById('secret-menu').style.display = 'none';
                    isSecretMenuOpen = false;
                } catch (e) { container.innerHTML = `<h1>FOUT: Inladen ${year} mislukt</h1>`; }
            }

            function render() {
                container.innerHTML = '';

                games.forEach((game, index) => {
                    const card = document.createElement('div');
                    card.className = `game-card ${index === currentIndex ? 'selected' : ''}`;
                    card.id = `card-${index}`;
                    const thumb = `https://makecode.com/api/${game.shareId}/thumb`;

                    card.innerHTML = `
                    <img class="thumb" src="${thumb}" onerror="this.src='assets/backup.jpg'">
                    <div class="title">${game.name.toUpperCase()}</div>
                    <div class="author">${game.author.toUpperCase()}</div>
                `;
                    container.appendChild(card);
                });

                const offset = currentIndex * -482;
                container.style.transform = `translateX(${offset}px)`;
            }

            document.addEventListener('keydown', (e) => {
                if (isPlaying) {
                    const iframe = document.getElementById('makecode-iframe');
                    if (iframe) {
                        iframe.focus();
                        return;
                    }
                }

                activeKeys.add(e.key);

                if (activeKeys.has('1') && activeKeys.has('2')) {
                    if (isPlaying) {
                        exitGame();
                    } else if (isSecretMenuOpen) {
                        document.getElementById('secret-menu').style.display = 'none';
                        isSecretMenuOpen = false;
                    }
                    return;
                }

                if (isPlaying) {
                    if (e.key === 'Escape' || e.key === 'q' || e.key === 'Q') {
                        exitGame();
                    }
                    return;
                }

                if (isSecretMenuOpen) {
                    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                        if (secretMenuIndex < secretMenuOptions.length - 1) {
                            secretMenuIndex++;
                            renderSecretMenu();
                        }
                    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                        if (secretMenuIndex > 0) {
                            secretMenuIndex--;
                            renderSecretMenu();
                        }
                    } else if (e.key === 'Enter' || e.key === ' ' || e.key === 'Control') {
                        secretMenuOptions[secretMenuIndex].action();
                    } else if (e.key === 'Alt') {
                        document.getElementById('secret-menu').style.display = 'none';
                        isSecretMenuOpen = false;
                    }
                    return;
                }

                if (e.key === 'ArrowRight' && currentIndex < games.length - 1) {
                    currentIndex++;
                    render();
                } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    currentIndex--;
                    render();
                } else if (e.key === ' ' || e.key === 'Control') {
                    const now = Date.now();
                    if (now - lastEnterTime < 2000) {
                        enterPresses++;
                    } else {
                        enterPresses = 1;
                    }
                    lastEnterTime = now;

                    if (enterPresses >= 5) {
                        enterPresses = 0;
                        isSecretMenuOpen = true;
                        secretMenuIndex = 0;
                        renderSecretMenu();
                        document.getElementById('secret-menu').style.display = 'block';
                    }

                    if (!isSecretMenuOpen && e.key === 'Control') {
                        startGame();
                    }
                } else if (e.key === 'Enter') {
                    startGame();
                }
            });

            // --- Nieuw: startGame() geoptimaliseerd met Laadscherm en Bliksem-Clicker ---
            function startGame() {
                isPlaying = true;

                // 1. Laat het Arcade laadscherm direct zien
                loadingOverlay.style.display = 'flex';

                const game = games[currentIndex];
                const gameUrl = `https://arcade.makecode.com/---run?id=${game.shareId}&fullscreen=1&hideSimButtons=1&nofooter=1`;

                // 2. Maak het iframe aan, maar verberg het nog even
                gameContainer.innerHTML = `<iframe src="${gameUrl}" 
        sandbox="allow-scripts allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox allow-forms" 
        allow="gamepad; autoplay" 
        allowfullscreen 
        tabindex="-1" 
        style="display: none;" 
        id="makecode-iframe"></iframe>`;

                // Verberg het laadscherm en toon het iframe wanneer het geladen is
                const iframe = document.getElementById('makecode-iframe');
                iframe.onload = () => {
                    // Wacht even tot MakeCode echt klaar is
                    setTimeout(() => {
                        loadingOverlay.style.display = 'none';
                        iframe.style.display = 'block';
                        gameContainer.style.display = 'block';
                        exitBtn.style.display = 'block';

                        // DE BLIKSEM-CLICKER TRIGGERE (Linux-script ziet dit)
                        document.title = "TRIGGER_FOCUS";

                        // Reset titel na de klik
                        setTimeout(() => {
                            document.title = "JUNIOR DEV GAME PORTAL";
                        }, 2000);

                    }, 1000); // 1 seconde MakeCode-opstarttijd
                };
            }
            // --- Einde Nieuw: startGame ---

            window.addEventListener('mousedown', () => {
                if (isPlaying) {
                    const iframe = document.getElementById('makecode-iframe');
                    if (iframe) {
                        setTimeout(() => {
                            iframe.focus();
                            if (iframe.contentWindow) iframe.contentWindow.focus();
                        }, 10);
                    }
                }
            });

            init();
        </script>
</body>

</html>
